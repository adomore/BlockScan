[package]
name = "blockscan"
version = "1.1.0"
edition = "2021"
# The floor is not a preference: slang_solidity 1.3.8 and its metaslang crates —
# the parser the AST tier runs on — declare rust-version 1.97.1, and nothing in
# the locked graph asks for more. Declaring it makes an inherited constraint
# visible instead of leaving CI to build against whatever is stable that day.
# The `msrv` CI job reads this value rather than repeating it.
rust-version = "1.97.1"
description = "Scan Ethereum smart contracts: discover, download verified source + bytecode + details, run a standardized security audit, and emit machine/human output"
license = "MIT"
readme = "README.md"
authors = ["adomore <adomore@gmail.com>"]
keywords = ["ethereum", "evm", "security", "audit", "solidity"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-std", "io-util", "net"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "tokio"] }
http-body-util = "0.1"
bytes = "1"
alloy = { version = "0.8", features = ["providers", "transport-http", "rpc-types-eth", "json-rpc", "network", "eips"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
governor = "0.6"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
futures = "0.3"
slang_solidity = "1.3.6"
# OS CSPRNG only — used to mint the MCP bearer credential when HTTP mode is
# started without one. Already in the tree transitively; named here because a
# credential must not come from a non-cryptographic source.
getrandom = "0.2"
# T-13 bundle. `sha256` is what the supply-chain ecosystem verifies with, so a
# bundle carrying only this project's native keccak256 would need bespoke
# tooling to check — which is the thing the task forbids. Both are emitted.
sha2 = "0.10"
# A real run-time timestamp, RFC 3339. `now` only: no timezone database, since
# the bundle records UTC and nothing else.
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
alloy = { version = "0.8" }

[profile.release]
opt-level = 3
