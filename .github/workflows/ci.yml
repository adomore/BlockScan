name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The three gates the README documents. Integration tests mock every remote
  # (wiremock), so no job needs network access beyond fetching crates.
  #
  # There is no `paths:` filter on purpose: tests/docs_lockstep.rs enforces the
  # structural parity of each bilingual document pair, and a docs-only change is
  # exactly the change that can break it.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms independently — a failure on one should not hide
      # the other's result.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-targets also compiles examples/, so example rot fails the build.
      - run: cargo test --all-targets --locked

  clippy:
    name: clippy (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Builds against exactly the version Cargo.toml declares, read from the file
  # rather than repeated here — a hard-coded copy is a second source of truth
  # that drifts silently and turns the gate into decoration. The floor is
  # inherited from slang_solidity, not chosen, so it moves when that dep does.
  msrv:
    name: msrv (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: floor
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$v" || { echo "Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests and examples are held to the floor too, not just
      # the library: an MSRV that only the lib respects is not an MSRV.
      - run: cargo check --all-targets --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # CI-measured line coverage is 97.74%; the gate sits just below it so ordinary
      # churn does not trip it, but a real coverage regression does.
      - run: cargo llvm-cov --locked --ignore-filename-regex 'main\.rs' --show-missing-lines --fail-under-lines 97
