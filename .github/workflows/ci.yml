name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The three gates the README documents. Integration tests mock every remote
  # (wiremock), so no job needs network access beyond fetching crates.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms independently — a failure on one should not hide
      # the other's result.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-targets also compiles examples/, so example rot fails the build.
      - run: cargo test --all-targets --locked

  clippy:
    name: clippy (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # CI-measured line coverage is 97.74%; the gate sits just below it so ordinary
      # churn does not trip it, but a real coverage regression does.
      - run: cargo llvm-cov --locked --ignore-filename-regex 'main\.rs' --show-missing-lines --fail-under-lines 97
